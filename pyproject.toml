[project]
name = "jellyseerr-matrix-request-bot"
version = "0.1.0"
description = "Interactive Jellyseerr request bot for Matrix - search and request media via chat, companion to jellyseerr-matrix-bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matrix-nio[e2e]==0.25.2",
    "aiohttp>=3.14.1",
    "prometheus-client>=0.25.0",
    "langchain[openai]>=0.3.24",
    "langgraph>=0.3.34",
    "openai>=1.76.0",
]

[dependency-groups]
dev = [
    "ipython>=9.2.0",
]
